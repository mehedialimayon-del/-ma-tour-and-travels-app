name: Build MA Travels APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Generate Android WebView wrapper
        run: |
          mkdir -p app/src/main/java/com/matour/travels app/src/main/assets app/src/main/res/drawable-nodpi
          cp app-icon.png app/src/main/res/drawable-nodpi/app_icon.png
          cp header-logo.gif app/src/main/assets/header-logo.gif
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MATourTravels'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.matour.travels'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.matour.travels'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:icon="@drawable/app_icon" android:label="MA Tour &amp; Travels" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/matour/travels/MainActivity.java <<'EOF'
          package com.matour.travels;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          public class MainActivity extends Activity {
          WebView web;
          static final String REMOTE = "https://raw.githubusercontent.com/mehedialimayon-del/-ma-tour-and-travels-app/main/";
          @Override public void onCreate(Bundle saved) {
          super.onCreate(saved);
          getWindow().setStatusBarColor(0xff07142d);
          getWindow().setNavigationBarColor(0xff07142d);
          web = new WebView(this);
          web.getSettings().setJavaScriptEnabled(true);
          web.getSettings().setDomStorageEnabled(true);
          web.getSettings().setAllowFileAccess(true);
          web.addJavascriptInterface(new Object() {
          @JavascriptInterface public void refresh() { runOnUiThread(() -> loadLatest()); }
          }, "OfficeNative");
          web.setWebViewClient(new WebViewClient() {
          @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
          Uri uri=request.getUrl();
          if(!"http".equals(uri.getScheme()) && !"https".equals(uri.getScheme())) {
          try {startActivity(new Intent(Intent.ACTION_VIEW,uri));}catch(Exception ignored){}
          return true;
          }
          if(!uri.toString().startsWith(REMOTE)) {
          try {startActivity(new Intent(Intent.ACTION_VIEW,uri));}catch(Exception ignored){}
          return true;
          }
          return false;
          }
          });
          setContentView(web);
          loadLatest();
          }
          void loadLatest(){
          new Thread(() -> {
          String html=null;
          try {
          HttpURLConnection conn=(HttpURLConnection)new URL(REMOTE+"index.html?t="+System.currentTimeMillis()).openConnection();
          conn.setConnectTimeout(7000);
          conn.setReadTimeout(9000);
          conn.setRequestProperty("Cache-Control","no-cache");
          if(conn.getResponseCode()==200) {
          InputStream in=conn.getInputStream();
          ByteArrayOutputStream out=new ByteArrayOutputStream();
          byte[] buf=new byte[8192];int n;
          while((n=in.read(buf))!=-1)out.write(buf,0,n);
          html=out.toString("UTF-8");
          in.close();
          }
          conn.disconnect();
          }catch(Exception ignored){}
          final String page=html;
          runOnUiThread(() -> {
          if(page!=null && page.contains("<html")) {
          web.loadDataWithBaseURL(REMOTE,page,"text/html","UTF-8",null);
          } else {
          web.loadUrl("file:///android_asset/index.html");
          }
          });
          }).start();
          }
          @Override public void onBackPressed() {
          if (web.canGoBack()) web.goBack(); else super.onBackPressed();
          }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 12
          unzip -l "$APK" | grep -E 'classes.dex|assets/index.html|AndroidManifest.xml'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MA-TOUR-TRAVELS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
