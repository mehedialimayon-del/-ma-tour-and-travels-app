<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142d"><title>MA TOUR & TRAVELS</title><style>
:root{--bg:#07142d;--card:#10254a;--line:#294269;--blue:#1645ff;--orange:#ff791f;--muted:#a9bddc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:white;font-family:system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:fixed;top:0;left:0;right:0;height:76px;background:#07142df5;border-bottom:1px solid var(--line);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 17px}.brand{font-size:19px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--orange)}.small{font-size:11px;color:var(--muted)}.round{background:var(--card);border:1px solid var(--line);color:white;border-radius:12px;padding:11px}.main{position:fixed;top:76px;bottom:73px;left:0;right:0;overflow-y:auto;padding:18px 16px 30px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.hero{background:linear-gradient(120deg,#143a7a,#0b1e40);padding:22px;border:1px solid #31599a;border-radius:20px;margin-bottom:14px}.hero strong{display:block;font-size:28px;margin:9px 0}.tag{color:#ffad72;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.statvalue{font-weight:800;font-size:21px;margin:9px 0 3px}.orange{color:var(--orange)}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:88px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:7px 3px}.tile .emoji{font-size:24px}.tile span:last-child{font-size:10px;text-align:center;overflow-wrap:anywhere}.nav{position:fixed;bottom:0;left:0;right:0;height:73px;background:#0d2040;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#c3d0e5;font-size:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.nav .active{color:var(--orange)}.nav b{font-size:21px}.action{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:700}.ghost{background:#19345e;border:1px solid var(--line);color:white;border-radius:10px;padding:10px}.toolbar{display:flex;gap:8px;margin:15px 0}.toolbar input{flex:1;min-width:0}.input{background:#10254a;border:1px solid #35517a;color:white;border-radius:10px;padding:12px;width:100%;outline:none}.input:focus{border-color:var(--orange)}.record{padding:14px;margin:9px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}.record strong{display:block;margin-bottom:5px}.pill{display:inline-block;border-radius:50px;background:#173e70;color:#d9eaff;padding:5px 9px;font-size:10px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.formgrid{display:grid;grid-template-columns:1fr;gap:12px}.formgrid label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.notice{padding:12px;background:#2c261e;border:1px solid #76502a;border-radius:12px;color:#ffbd8d;font-size:12px;margin-bottom:16px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.back{background:none;color:var(--orange);border:0;padding:0;font-size:14px}@media(min-width:800px){.main{left:50%;transform:translateX(-50%);width:800px}.nav{left:50%;transform:translateX(-50%);width:800px}.tiles{grid-template-columns:repeat(5,1fr)}header{padding-left:max(20px,calc((100vw - 780px)/2));padding-right:max(20px,calc((100vw - 780px)/2))}}
</style></head><body><header><div><div class="brand">MA <span>TOUR & TRAVELS</span></div><div class="small">OWNER CONTROL • UI PROTOTYPE</div></div><button class="round" onclick="showPage('Reminders')">🔔</button></header><main id="main" class="main"></main><nav id="nav" class="nav"></nav><script>
const modules=["Dashboard","Attendance","Salary & Payroll","Air Tickets","Ticket Accounts","Clients","Client Files","Offers","Visa Processing","Tour Packages","Hotel & Transport","Invoices","Company Accounts","Suppliers","Refunds","Reports","Website","Reminders","Staff Access","Settings"],icons=["📊","📅","💵","✈️","🧮","👥","📁","🏷️","🛂","🌍","🏨","🧾","🏦","🤝","↩️","📈","🔗","🔔","🛡️","⚙️"],fields={"Attendance":"Employee,Date,Clock In,Clock Out,Status","Salary & Payroll":"Employee,Month,Basic Salary,Bonus,Deduction,Payment Date,Status","Air Tickets":"Passenger,PNR,Airline,Route,Travel Date,Ticket Number,Status","Ticket Accounts":"Passenger,PNR,Cost Price,Selling Price,Service Charge,Paid,Due","Clients":"Client Name,Phone,Email,Passport Number,Nationality,Status","Client Files":"Client,Document Type,File Name,Expiry Date,Status","Offers":"Offer Title,Destination,Price,Valid Until,Status","Visa Processing":"Client,Country,Visa Type,Submission Date,Status","Tour Packages":"Package,Destination,Departure Date,Price,Status","Hotel & Transport":"Client,Hotel / Vehicle,Check-in,Check-out,Cost","Invoices":"Invoice Number,Client,Amount,Paid,Due,Date","Company Accounts":"Transaction Type,Category,Amount,Date,Description","Suppliers":"Supplier Name,Service,Contact,Payable,Status","Refunds":"PNR,Client,Refund Amount,Penalty,Status","Reports":"Report Type,From Date,To Date,Format","Website":"Website URL,Description","Reminders":"Reminder Title,Due Date,Priority,Status","Staff Access":"Staff Name,Role,Permissions,Status","Settings":"Company Name,Currency,Phone,Email,Address"};let page='Dashboard';const state={};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function seed(name){return ({'Attendance':[['Ayesha Rahman','15 Nov 2026','09:05','18:00','Present'],['Hasan Ali','15 Nov 2026','09:22','18:10','Late']],'Salary & Payroll':[['Ayesha Rahman','Nov 2026','2500','150','0','30 Nov 2026','Pending']],'Air Tickets':[['Demo Passenger','MA1234','Malaysia Airlines','KUL → DAC','20 Dec 2026','232-1234567890','Issued']],'Clients':[['Demo Client','+60 100000000','demo@example.com','A0000000','Bangladeshi','Active']],'Offers':[['Dhaka Flight Offer','Bangladesh','RM 999','31 Dec 2026','Active']]}[name]||[])}function records(name){return state[name]||(state[name]=seed(name).map((values,i)=>({id:i+1,values})))}function showPage(name){page=name;history.pushState({page:name},'', '#'+encodeURIComponent(name));render()}function back(){history.back()}window.addEventListener('popstate',()=>{page=decodeURIComponent(location.hash.slice(1))||'Dashboard';render()});function render(){let m=document.getElementById('main');let idx=modules.indexOf(page);if(idx<0){page='Dashboard';idx=0}let nav=['Dashboard','Air Tickets','Clients','Company Accounts','Settings'];document.getElementById('nav').innerHTML=nav.map((n,i)=>'<button class="'+(page===n?'active':'')+'" onclick="showPage(\''+n+'\')"><b>'+['⌂','✈','♙','▣','☰'][i]+'</b>'+['Home','Tickets','Clients','Finance','Menu'][i]+'</button>').join('');if(page==='Dashboard'){m.innerHTML='<div class="topline"><div><h1>Business Overview</h1><div class="muted">Welcome back, Owner</div></div><span class="pill">DEMO MODE</span></div><div class="notice">Preview layout only • Sample figures • No real business data stored on server.</div><div class="hero"><div class="muted">Total Revenue • This Month</div><strong>RM 125,450</strong><div class="tag">✦ Premium Travel Management</div></div><div class="stats">'+[['248','Tickets Issued','✈️'],['186','Active Clients','👥'],['RM 18,500','Pending Payments','💳'],['08 / 10','Staff Present','📅']].map(x=>'<div class="card"><span class="orange">'+x[2]+'</span><div class="statvalue">'+x[0]+'</div><div class="muted">'+x[1]+'</div></div>').join('')+'</div><h2>All Modules</h2><div class="tiles">'+modules.slice(1).map((n,i)=>'<button class="tile" onclick="showPage(\''+n+'\')"><span class="emoji">'+icons[i+1]+'</span><span>'+n+'</span></button>').join('')+'</div><h2>Recent Activities</h2><div class="record">✈️ Demo ticket issued <span class="pill">Sample</span></div><div class="record">💵 Salary entry awaiting approval <span class="pill">Sample</span></div>';return}let f=(fields[page]||'Name,Description,Status').split(',');m.innerHTML='<div class="topline"><div><button class="back" onclick="back()">‹ Back</button><h1 style="margin-top:10px">'+icons[idx]+' '+safe(page)+'</h1><div class="muted">MA TOUR & TRAVELS • '+safe(page)+' Management</div></div><span class="pill">DEMO</span></div><div class="notice">Layout demonstration. Changes are temporary and reset on reload.</div><div class="toolbar"><input class="input" id="search" placeholder="Search '+safe(page)+'..." oninput="drawRecords()"><button class="action" onclick="toggleForm()">＋ Add</button></div><div id="entry" class="card" style="display:none;margin-bottom:15px"><h2>New '+safe(page)+' Entry</h2><div class="formgrid">'+f.map((x,i)=>'<div><label>'+safe(x)+'</label><input class="input" id="field'+i+'" placeholder="Enter '+safe(x)+'"></div>').join('')+'<button class="action" onclick="saveEntry()">Save Demo Entry</button></div></div><div class="row"><h2>Records</h2><span class="muted" id="count"></span></div><div id="records"></div>';drawRecords()}function toggleForm(){let el=document.getElementById('entry');el.style.display=el.style.display==='none'?'block':'none'}function saveEntry(){let f=(fields[page]||'Name,Description,Status').split(',');let values=f.map((_,i)=>document.getElementById('field'+i).value.trim());if(!values.some(Boolean))return alert('Enter at least one field');records(page).unshift({id:Date.now(),values});toggleForm();drawRecords()}function drawRecords(){let el=document.getElementById('records');if(!el)return;let q=(document.getElementById('search')?.value||'').toLowerCase();let f=(fields[page]||'Name,Description,Status').split(',');let rs=records(page).filter(r=>r.values.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=rs.length+' entries';el.innerHTML=rs.length?rs.map(r=>'<div class="record"><div class="row"><strong>'+safe(r.values[0]||'Untitled')+'</strong><button class="ghost" onclick="removeEntry('+r.id+')">Delete</button></div>'+f.slice(1).map((x,i)=>r.values[i+1]?'<div class="muted" style="margin-top:7px">'+safe(x)+': <span style="color:white">'+safe(r.values[i+1])+'</span></div>':'').join('')+'<span class="pill">Demo Record</span></div>').join(''):'<div class="empty">No records yet. Tap + Add to preview a new entry.</div>'}function removeEntry(id){if(!confirm('Delete demo entry?'))return;state[page]=records(page).filter(r=>r.id!==id);drawRecords()}page=decodeURIComponent(location.hash.slice(1))||'Dashboard';render();
</script></body></html>
