function renderDirectory(m){m.innerHTML='<div class="row"><h1>👥 Staff Directory</h1><button class="action" onclick="staffModal()">+ Add Staff</button></div><div class="muted" style="margin-bottom:14px">Staff profiles and tap-to-call contacts • saved on this phone only</div><input id="staffSearch" class="input" placeholder="Search staff by name, role or department" oninput="drawStaff()"><div id="staffList"></div>';drawStaff()}
function drawStaff(){const el=document.getElementById('staffList');if(!el)return;const q=(document.getElementById('staffSearch')?.value||'').toLowerCase();const arr=profiles.map((p,i)=>({...p,i})).filter(p=>[p.name,p.role,p.department,p.phone,p.email].join(' ').toLowerCase().includes(q));el.innerHTML=arr.length?arr.map(p=>'<div class="staff-card"><div class="staff-avatar">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="Staff photo">':'👤')+'</div><div class="staff-info"><b>'+esc(p.name)+'</b><small>'+esc(p.role)+' • '+esc(p.department)+'</small><div class="staff-actions"><a href="tel:'+encodeURIComponent(p.phone)+'">📞 Call</a><a href="mailto:'+encodeURIComponent(p.email)+'">✉ Email</a><a href="https://wa.me/'+encodeURIComponent(p.phone.replace(/[^0-9]/g,''))+'">WhatsApp</a><button onclick="staffModal('+p.i+')">Edit</button></div></div></div>').join(''):'<div class="empty">No staff records yet. Tap Add Staff to create a profile.</div>'}
function staffModal(i=-1){const p=profiles[i]||{};modal(i<0?'Add Staff Profile':'Edit Staff Profile','<div class="formgrid">'+[['Name','name'],['Designation','role'],['Department','department'],['Phone (country code)','phone'],['Email','email']].map(([label,key])=>'<label>'+label+'<input class="input" id="staff_'+key+'" value="'+esc(p[key]||'')+'"></label>').join('')+'<label>Profile Photo<input type="file" accept="image/*" id="staffPhoto"></label><button class="action" onclick="saveStaff('+i+')">Save Profile</button>'+(i>=0?'<button class="ghost" onclick="deleteStaff('+i+')">Delete Profile</button>':'')+'</div>')}
function saveStaff(i){const p={};for(const k of ['name','role','department','phone','email'])p[k]=document.getElementById('staff_'+k).value.trim();if(!p.name)return alert('Enter staff name');p.photo=profiles[i]?.photo||'';const file=document.getElementById('staffPhoto').files[0];const finish=()=>{if(i>=0)profiles[i]=p;else profiles.push(p);saveLocal(profileKey,profiles);closeModal();renderDirectory(document.getElementById('main'))};if(file){if(file.size>350000)return alert('Please choose a photo under 350 KB');const reader=new FileReader();reader.onload=()=>{p.photo=reader.result;finish()};reader.readAsDataURL(file)}else finish()}
function deleteStaff(i){if(!confirm('Delete this profile?'))return;profiles.splice(i,1);saveLocal(profileKey,profiles);closeModal();renderDirectory(document.getElementById('main'))}
function renderChat(m){m.innerHTML='<div class="row"><h1>💬 Team Chat</h1><span class="pill">LOCAL DEMO</span></div><div class="notice">Messages are stored on this phone only. This is not live multi-user WhatsApp messaging.</div><div class="chat-shell"><div class="chat-history" id="chatHistory"></div><div class="chat-compose"><input class="input" id="chatName" placeholder="Your name" value="Office Staff"><input class="input" id="chatInput" placeholder="Type office message..." onkeydown="if(event.key===\'Enter\')sendChat()"><button class="action" onclick="sendChat()">Send</button></div></div>';drawChat()}
function drawChat(){const el=document.getElementById('chatHistory');if(!el)return;el.innerHTML=chatMessages.length?chatMessages.map(c=>'<div class="chat-bubble"><b>'+esc(c.name)+'</b><p>'+esc(c.text)+'</p><small>'+esc(c.time)+'</small></div>').join(''):'<div class="empty">No messages yet. Start a demo conversation.</div>';el.scrollTop=el.scrollHeight}
function sendChat(){const name=document.getElementById('chatName').value.trim()||'Staff',input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;chatMessages.push({name,text,time:new Date().toLocaleString()});saveLocal(chatKey,chatMessages);input.value='';drawChat()}
function renderMarketing(m){m.innerHTML='<div class="row"><h1>📣 Marketing Hub</h1><button class="action" onclick="marketingModal()">+ Campaign</button></div><div class="muted">Plan campaigns, record leads and track follow-ups on this device</div><div class="stats" style="margin-top:14px"><div class="card"><div class="muted">Campaigns</div><div class="statvalue">'+campaigns.length+'</div></div><div class="card"><div class="muted">Leads</div><div class="statvalue">'+campaigns.reduce((a,c)=>a+(Number(c.leads)||0),0)+'</div></div></div>'+ (campaigns.length?campaigns.map((c,i)=>'<div class="record"><strong>'+esc(c.title)+'</strong><div class="record-line"><span>Channel</span><b>'+esc(c.channel)+'</b></div><div class="record-line"><span>Leads</span><b>'+esc(c.leads)+'</b></div><div class="record-line"><span>Status</span><b>'+esc(c.status)+'</b></div><div class="record-line"><span>Next Follow-up</span><b>'+esc(c.followup)+'</b></div><button class="ghost" onclick="marketingModal('+i+')">Edit</button></div>').join(''):'<div class="empty">No campaigns yet. Create a marketing campaign.</div>')}
function marketingModal(i=-1){const c=campaigns[i]||{};modal('Marketing Campaign','<div class="formgrid">'+[['Campaign Name','title'],['Channel / Platform','channel'],['Lead Count','leads'],['Status','status'],['Next Follow-up','followup']].map(([label,k])=>'<label>'+label+'<input class="input" id="campaign_'+k+'" value="'+esc(c[k]||'')+'"></label>').join('')+'<button class="action" onclick="saveCampaign('+i+')">Save Campaign</button></div>')}
function saveCampaign(i){const c={};for(const k of ['title','channel','leads','status','followup'])c[k]=document.getElementById('campaign_'+k).value.trim();if(!c.title)return alert('Enter campaign name');if(i>=0)campaigns[i]=c;else campaigns.push(c);saveLocal(marketingKey,campaigns);closeModal();renderMarketing(document.getElementById('main'))}
renderTicker();render();
</script></body></html>
