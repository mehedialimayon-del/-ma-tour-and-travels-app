<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07142d"><title>MA TOUR & TRAVELS</title><style>
:root{--bg:#07142d;--card:#10254a;--line:#294269;--blue:#1645ff;--orange:#ff791f;--muted:#a9bddc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:white;font-family:system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}header{position:fixed;top:0;left:0;right:0;height:76px;background:#07142df5;border-bottom:1px solid var(--line);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 17px}.brand{font-size:19px;font-weight:900;letter-spacing:-.5px}.brand span{color:var(--orange)}.small{font-size:11px;color:var(--muted)}.round{background:var(--card);border:1px solid var(--line);color:white;border-radius:12px;padding:11px}.main{position:fixed;top:76px;bottom:73px;left:0;right:0;overflow-y:auto;padding:18px 16px 30px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:23px;margin:0 0 5px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.hero{background:linear-gradient(120deg,#143a7a,#0b1e40);padding:22px;border:1px solid #31599a;border-radius:20px;margin-bottom:14px}.hero strong{display:block;font-size:28px;margin:9px 0}.tag{color:#ffad72;font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}.statvalue{font-weight:800;font-size:21px;margin:9px 0 3px}.orange{color:var(--orange)}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:88px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:7px 3px}.tile .emoji{font-size:24px}.tile span:last-child{font-size:10px;text-align:center;overflow-wrap:anywhere}.nav{position:fixed;bottom:0;left:0;right:0;height:73px;background:#0d2040;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#c3d0e5;font-size:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.nav .active{color:var(--orange)}.nav b{font-size:21px}.action{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 14px;font-weight:700}.ghost{background:#19345e;border:1px solid var(--line);color:white;border-radius:10px;padding:10px}.toolbar{display:flex;gap:8px;margin:15px 0}.toolbar input{flex:1;min-width:0}.input{background:#10254a;border:1px solid #35517a;color:white;border-radius:10px;padding:12px;width:100%;outline:none}.input:focus{border-color:var(--orange)}.record{padding:14px;margin:9px 0;background:var(--card);border:1px solid var(--line);border-radius:14px}.record strong{display:block;margin-bottom:5px}.pill{display:inline-block;border-radius:50px;background:#173e70;color:#d9eaff;padding:5px 9px;font-size:10px;margin-top:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.formgrid{display:grid;grid-template-columns:1fr;gap:12px}.formgrid label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.notice{padding:12px;background:#2c261e;border:1px solid #76502a;border-radius:12px;color:#ffbd8d;font-size:12px;margin-bottom:16px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.back{background:none;color:var(--orange);border:0;padding:0;font-size:14px}@media(min-width:800px){.main{left:50%;transform:translateX(-50%);width:800px}.nav{left:50%;transform:translateX(-50%);width:800px}.tiles{grid-template-columns:repeat(5,1fr)}header{padding-left:max(20px,calc((100vw - 780px)/2));padding-right:max(20px,calc((100vw - 780px)/2))}}
.section-hero strong{font-size:22px}.record-line{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:10px 0;font-size:12px}.record-line span{color:var(--muted)}.record-line b{text-align:right;font-weight:600;overflow-wrap:anywhere}.entry-form{margin:12px 0 18px}.entry-form h2{color:var(--orange)}.main{padding-bottom:32px}.nav{height:calc(73px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.main{bottom:calc(73px + env(safe-area-inset-bottom))}.tile{min-height:90px}.section-hero{background:linear-gradient(120deg,#143a7a,#10254a)} </style></head><body><header><div><div class="brand">MA <span>TOUR & TRAVELS</span></div><div class="small">OFFICE STAFF • INTERNAL DEMO</div></div><button class="round" onclick="showPage('Reminders')">🔔</button></header><main id="main" class="main"></main><nav id="nav" class="nav"></nav><script>
const modules=[["Office Dashboard","🏢","Overview","Sales, staff presence and pending approvals","Today's Operations","Revenue|RM 12,450;Tickets|18;Staff Present|8/10;Pending Due|RM 3,500","Recent Office Activity"],["Staff Attendance","📅","People","Clock-in, clock-out and attendance log","Today's Attendance","Present|8;Late|1;Absent|1;On Leave|0","Attendance Register"],["Salary & Payroll","💵","Payroll","Monthly salary calculation and payment dates","November Payroll","Staff|10;Paid|6;Pending|4;Total|RM 25,000","Employee Salary Sheet"],["Duty Roster","🗓️","Scheduling","Shift assignments and leave planning","Weekly Shift Plan","Morning|5;Evening|3;Off|2;Changes|1","Assigned Shifts"],["Air Ticket Entry","✈️","Ticketing","Register tickets booked through suppliers","Ticket Issuance Desk","Issued|18;Pending|3;Voided|1;Today|RM 12,450","Ticket Register"],["Ticket Sales & Profit","🧮","Finance","Track ticket cost, selling price and margin","Ticket Profit Overview","Sales|RM 12,450;Cost|RM 10,270;Gross Profit|RM 2,180;Due|RM 3,500","Ticket Profit Records"],["PNR & Ticket Status","🎫","Ticketing","Follow up booking and issuance status","PNR Tracking","Issued|18;On Hold|3;Cancelled|1;Reissue|2","PNR Status Board"],["Client Records","👥","CRM","Internal customer records for office staff","Client Database","Clients|186;New Today|5;Active|42;Follow-ups|7","Customer Directory"],["Client Documents","📁","Files","Passport, visa and ticket document register","Document Control","Documents|93;Pending|8;Expiring|4;Verified|81","Document Register"],["Visa Case Tracking","🛂","Visa","Application progress and case follow-up","Visa Processing Desk","Active|21;Submitted|8;Approved|5;Pending Docs|3","Visa Case Register"],["Payment Collection","💳","Accounts","Track client payments and outstanding balances","Receivables","Collected|RM 8,950;Due|RM 3,500;Partial|6;Unpaid|3","Payment Register"],["Invoice & Receipt","🧾","Billing","Invoice and receipt tracking","Invoice Control","Invoices|24;Paid|16;Partial|5;Due|3","Invoice Register"],["Daily Cash Closing","💰","Accounts","Daily opening, collections and closing cash","Cash Reconciliation","Opening|RM 2,000;Cash In|RM 3,200;Cash Out|RM 750;Closing|RM 4,450","Daily Closing Register"],["Office Expenses","🏦","Accounts","Record operating costs and reimbursements","Expense Summary","Today|RM 750;This Month|RM 6,420;Pending|3;Categories|8","Expense Register"],["Supplier Ledger","🤝","Suppliers","Supplier purchases, payments and balances","Supplier Payables","Suppliers|8;Outstanding|RM 9,800;Paid|RM 4,200;Due Soon|2","Supplier Statement"],["Refund & Reissue","↩️","Ticketing","Ticket refunds, cancellations and reissues","Refund Desk","Requested|4;Approved|2;Paid|1;Reissue|2","Refund Requests"],["Offers & Promotions","🏷️","Marketing","Current fare offers and promotional campaigns","Active Promotions","Active|6;Expiring|2;Scheduled|3;Paused|1","Offer Library"],["Staff Tasks","📋","Operations","Assign work and review task completion","Task Tracker","Assigned|15;Completed|9;Overdue|2;High Priority|3","Task Board"],["Reports & Analytics","📈","Insights","Daily, weekly and monthly office reports","Performance Reports","Sales|RM 12,450;Gross Profit|RM 2,180;Tickets|18;Collections|RM 8,950","Report Requests"],["Staff Permissions","🛡️","Admin","Roles and access control planning","Access Control","Staff|10;Managers|2;Ticketing|4;Accounts|2","Staff Role Directory"],["Notice & Meetings","🔔","Communication","Internal announcements and meeting plans","Office Notices","Active|3;Meetings|2;Read|8;Unread|2","Notices & Meetings"],["Website & Settings","⚙️","Configuration","Company profile and internal app preferences","Company Setup","Company|MA Travels;Currency|MYR;Mode|Demo;Access|Internal","Settings Records"]],fields={"Staff Attendance":["Employee Name","Date","Clock In","Clock Out","Status"],"Salary & Payroll":["Employee","Month","Basic Salary (RM)","Bonus (RM)","Deduction (RM)","Payment Date","Status"],"Duty Roster":["Employee","Shift Date","Start Time","End Time","Desk"],"Air Ticket Entry":["Passenger Name","PNR","Airline","Route","Travel Date","Ticket Number","Status"],"Ticket Sales & Profit":["PNR","Cost (RM)","Selling Price (RM)","Service Charge (RM)","Paid (RM)"],"PNR & Ticket Status":["PNR","Passenger","Airline","Departure Date","Status"],"Client Records":["Client Name","Phone","Email","Passport No.","Status"],"Client Documents":["Client","Document Type","Reference / File Name","Expiry Date","Status"],"Visa Case Tracking":["Client","Destination Country","Visa Type","Submission Date","Status"],"Payment Collection":["Client","Invoice / PNR","Amount (RM)","Payment Method","Date"],"Invoice & Receipt":["Invoice Number","Client","Amount (RM)","Paid (RM)","Status"],"Daily Cash Closing":["Date","Opening (RM)","Cash In (RM)","Cash Out (RM)","Approved By"],"Office Expenses":["Expense Category","Amount (RM)","Date","Paid By","Description"],"Supplier Ledger":["Supplier","Reference","Payable (RM)","Paid (RM)","Status"],"Refund & Reissue":["PNR","Client","Refund (RM)","Penalty (RM)","Status"],"Offers & Promotions":["Offer Title","Route","Offer Price (RM)","Valid Until","Status"],"Staff Tasks":["Task Title","Assigned To","Due Date","Priority","Status"],"Reports & Analytics":["Report Name","From Date","To Date","Format","Status"],"Staff Permissions":["Staff Name","Role","Department","Permission","Status"],"Notice & Meetings":["Title","Meeting Date","Time","Description","Status"],"Website & Settings":["Setting","Value","Updated By","Status"]},seed={"Staff Attendance":[["Ayesha Rahman","2026-11-15","09:05","18:00","Present"],["Hasan Ali","2026-11-15","09:22","18:10","Late"]],"Salary & Payroll":[["Ayesha Rahman","Nov 2026","2500","150","0","2026-11-30","Pending"]],"Duty Roster":[["Hasan Ali","2026-11-16","09:00","18:00","Ticketing Desk"]],"Air Ticket Entry":[["Rahim Ahmed","ABC123","Malaysia Airlines","KUL → DAC","2026-12-20","232-1234567890","Issued"]],"Ticket Sales & Profit":[["ABC123","850","1000","30","600"]],"PNR & Ticket Status":[["ABC123","Rahim Ahmed","Malaysia Airlines","2026-12-20","Issued"]],"Client Records":[["Rahim Ahmed","+60 100000000","rahim.demo@example.com","A0000000","Active"]],"Client Documents":[["Rahim Ahmed","Passport Copy","passport-demo.pdf","2028-12-31","Pending Review"]],"Visa Case Tracking":[["Demo Applicant","Malaysia","Tourist","2026-11-10","Processing"]],"Payment Collection":[["Rahim Ahmed","ABC123","600","Bank Transfer","2026-11-15"]],"Invoice & Receipt":[["INV-1001","Rahim Ahmed","1030","600","Partially Paid"]],"Daily Cash Closing":[["2026-11-15","2000","3200","750","Pending"]],"Office Expenses":[["Internet","150","2026-11-15","Accounts","Monthly broadband"]],"Supplier Ledger":[["Demo Airline Supplier","ABC123","850","0","Pending"]],"Refund & Reissue":[["XYZ890","Demo Passenger","500","100","Requested"]],"Offers & Promotions":[["KUL–DAC Special Fare","KUL → DAC","999","2026-12-31","Active"]],"Staff Tasks":[["Verify pending ticket","Hasan Ali","2026-11-16","High","In Progress"]],"Reports & Analytics":[["Daily Ticket Sales","2026-11-15","2026-11-15","PDF","Draft"]],"Staff Permissions":[["Ayesha Rahman","Manager","Operations","Review","Active"]],"Notice & Meetings":[["Weekly Ticketing Meeting","2026-11-17","10:00","Operations review","Scheduled"]],"Website & Settings":[["Currency","MYR","Admin","Active"]]};
const byName=Object.fromEntries(modules.map(x=>[x[0],x]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page=decodeURIComponent(location.hash.slice(1))||'Office Dashboard',showForm=false,searchText='',positions={};
const storeKey='ma-travels-office-demo-v2';
let records={};try{records=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){}
function list(n){if(!records[n])records[n]=(seed[n]||[]).map((v,i)=>({id:'sample-'+i,values:v}));return records[n]}
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(records))}catch(e){}}
function go(n){if(!byName[n])return;positions[page]=document.getElementById('main').scrollTop;page=n;showForm=false;searchText='';history.pushState({page:n},'', '#'+encodeURIComponent(n));render()}
function back(){if(history.length>1)history.back();else go('Office Dashboard')}
window.addEventListener('popstate',()=>{page=decodeURIComponent(location.hash.slice(1))||'Office Dashboard';showForm=false;searchText='';render()});
function tile(n){const x=byName[n];return '<button class="tile" onclick="go('+JSON.stringify(n).replace(/"/g,'&quot;')+')"><span class="emoji">'+x[1]+'</span><span>'+esc(n)+'</span></button>'}
function statGrid(arr){return '<div class="stats">'+arr.map(z=>{let a=z.split('|');return '<div class="card"><div class="muted">'+esc(a[0])+'</div><div class="statvalue">'+esc(a[1]||'—')+'</div></div>'}).join('')+'</div>'}
function header(x){return '<div class="topline"><div><button class="back" onclick="back()">‹ Back to previous page</button><h1 style="margin-top:12px">'+x[1]+' '+esc(x[0])+'</h1><div class="muted">'+esc(x[3])+'</div></div><span class="pill">'+esc(x[2])+'</span></div>'}
function render(){
let m=document.getElementById('main');m.scrollTop=0;
const nav=[['Office Dashboard','⌂','Home'],['Air Ticket Entry','✈','Tickets'],['Staff Tasks','☑','Tasks'],['Daily Cash Closing','▣','Finance'],['Website & Settings','☰','More']];
document.getElementById('nav').innerHTML=nav.map(([n,i,label])=>'<button class="'+(page===n?'active':'')+'" onclick="go('+JSON.stringify(n).replace(/"/g,'&quot;')+')"><b>'+i+'</b>'+label+'</button>').join('');
if(page==='Office Dashboard'){
m.innerHTML='<div class="topline"><div><h1>Office Dashboard</h1><div class="muted">Welcome to MA Tour & Travels</div></div><span class="pill">OFFICE DEMO</span></div><div class="notice">All records and totals are fictional demo examples. Entries save on this device only.</div><div class="hero"><div class="muted">Today’s Ticket Sales</div><strong>RM 12,450</strong><div class="tag">✦ Internal Office Operations</div></div>'+statGrid(['Issued Tickets|18','Gross Profit|RM 2,180','Staff Present|8/10','Pending Collection|RM 3,500'])+'<h2>Quick Actions</h2><div class="tiles">'+['Air Ticket Entry','Staff Attendance','Client Records','Payment Collection','Visa Case Tracking','Staff Tasks','Salary & Payroll','Daily Cash Closing'].map(tile).join('')+'</div><h2>All Office Modules</h2><div class="tiles">'+modules.slice(1).map(x=>tile(x[0])).join('')+'</div><h2>Recent Office Activity</h2><div class="record">✈️ Sample ticket ABC123 • Issued</div><div class="record">💳 Sample client payment • RM 600</div>';
}else{
const x=byName[page]||modules[0],fs=fields[page]||['Name','Description','Status'];
m.innerHTML=header(x)+'<div class="hero section-hero"><div class="muted">'+esc(x[4])+'</div><strong>'+esc(x[1])+' '+esc(x[2])+'</strong><div class="tag">'+esc(x[3])+'</div></div>'+statGrid(x[5].split(';'))+'<div class="notice">Sample data only • Records saved locally on this phone. No office server connected.</div><div class="row" style="margin:18px 0 10px"><h2 style="margin:0">'+esc(x[6])+'</h2><button class="action" onclick="toggleForm()">＋ New Entry</button></div><div class="toolbar"><input class="input" id="search" placeholder="Search '+esc(page)+'..." value="'+esc(searchText)+'" oninput="searchText=this.value;drawRecords()"></div><div id="entry" class="card entry-form" style="display:'+(showForm?'block':'none')+'"><h2>New '+esc(page)+' Record</h2><div class="formgrid">'+fs.map((f,i)=>'<div><label>'+esc(f)+'</label><input class="input" id="field'+i+'" placeholder="'+esc(f)+'"></div>').join('')+'<button class="action" onclick="saveEntry()">Save Demo Record</button><button class="ghost" onclick="toggleForm()">Cancel</button></div></div><div id="records"></div>';drawRecords();
}
m.scrollTop=positions[page]||0;
}
function toggleForm(){showForm=!showForm;let el=document.getElementById('entry');if(el){el.style.display=showForm?'block':'none';if(showForm){el.scrollIntoView({behavior:'smooth',block:'nearest'})}}}
function saveEntry(){const fs=fields[page]||['Name','Description','Status'];const v=fs.map((_,i)=>document.getElementById('field'+i).value.trim());if(!v[0])return alert('Please enter '+fs[0]);list(page).unshift({id:'entry-'+Date.now(),values:v});persist();showForm=false;document.getElementById('entry').style.display='none';drawRecords();alert('Demo entry saved on this device.')}
function drawRecords(){const el=document.getElementById('records');if(!el)return;const fs=fields[page]||[],q=searchText.toLowerCase();const rs=list(page).filter(r=>r.values.join(' ').toLowerCase().includes(q));el.innerHTML='<div class="muted" style="margin:8px 0">'+rs.length+' records</div>'+(rs.length?rs.map(r=>'<div class="record"><div class="row"><strong>'+esc(r.values[0])+'</strong><button class="ghost" onclick="removeEntry('+JSON.stringify(r.id).replace(/"/g,'&quot;')+')">Delete</button></div>'+fs.slice(1).map((f,i)=>r.values[i+1]?'<div class="record-line"><span>'+esc(f)+'</span><b>'+esc(r.values[i+1])+'</b></div>':'').join('')+'<span class="pill">'+(String(r.id).startsWith('sample')?'Sample Record':'Local Demo Entry')+'</span></div>').join(''):'<div class="empty">No records. Tap + New Entry to create one.</div>')}
function removeEntry(id){if(!confirm('Delete this demo record?'))return;records[page]=list(page).filter(r=>r.id!==id);persist();drawRecords()}
render();
</script></body></html>
