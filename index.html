 const rows=names.map((module,i)=>({user_id:userId,module,can_edit:!!document.getElementById('officeperm'+i)?.checked}));
 const {error}=await officeClient.from('office_module_permissions').upsert(rows,{onConflict:'user_id,module'});
 if(error)return alert(error.message);closeModal();alert('Staff edit permissions updated');
}
function prefillPendingStaff(name,email,role){document.getElementById('staffNewName').value=decodeURIComponent(name);document.getElementById('staffNewEmail').value=decodeURIComponent(email);document.getElementById('staffNewRole').value=role;document.getElementById('staffNewPass').focus()}
async function createOfficeStaff(){try{const name=document.getElementById('staffNewName').value,email=document.getElementById('staffNewEmail').value,password=document.getElementById('staffNewPass').value,role=document.getElementById('staffNewRole').value;await officeAdminCall({action:'create',name,email,password,role});document.getElementById('staffNewPass').value='';await loadStaffControl();alert('Staff account created')}catch(e){alert(e.message)}}
async function editOfficeStaff(user_id,encodedName,role){const name=prompt('Staff name',decodeURIComponent(encodedName));if(name===null)return;const newRole=prompt('Role: staff or manager',role);if(newRole===null)return;try{await officeAdminCall({action:'update',user_id,name,role:newRole});await loadStaffControl()}catch(e){alert(e.message)}}
async function toggleOfficeStaff(user_id,active){if(!confirm((active?'Activate':'Deactivate')+' this staff account?'))return;try{await officeAdminCall({action:'update',user_id,active});await loadStaffControl()}catch(e){alert(e.message)}}
async function resetOfficeStaffPassword(user_id){const password=prompt('Enter a new password (12+ characters)');if(password===null)return;try{await officeAdminCall({action:'password',user_id,password});alert('Password updated')}catch(e){alert(e.message)}}
async function deleteOfficeStaff(user_id){if(!confirm('Permanently delete this staff account and revoke login access?'))return;try{await officeAdminCall({action:'delete',user_id});await loadStaffControl()}catch(e){alert(e.message)}}
function renderChat(m){if(!m)return;const header='<div class="row"><h1>💬 Team Chat</h1><span class="pill">'+(officeProfile?'LIVE OFFICE':'SECURE LOGIN')+'</span></div>';if(!officeProfile){m.innerHTML=header+(officeUser?'<div class="notice">Your account is not yet approved as an active office staff member. Ask an administrator to add it.</div><button class="ghost" onclick="officeSignOut()">Sign Out</button>':officeLoginForm());return}m.innerHTML=header+officeStaffControlShortcut()+'<div class="row"><span class="chat-status">🟢 Shared office chat</span><button class="ghost" onclick="changeMyOfficePassword()">Change Password</button><button class="ghost" onclick="officeSignOut()">Sign Out</button></div><div class="chat-shell"><div class="chat-history" id="chatHistory"></div><div class="chat-compose"><input class="input" id="chatInput" placeholder="Message all staff..." onkeydown="if(event.key===\'Enter\')sendChat()"><button class="action" onclick="sendChat()">Send</button></div></div>';drawChat();officeSeen=officeMessages.length;localStorage.setItem(officeSeenKey,officeSeen);updateOfficeSignal()}
function drawChat(){const el=document.getElementById('chatHistory');if(!el)return;el.innerHTML=officeMessages.length?officeMessages.map(c=>'<div class="chat-bubble"><b>'+esc(c.sender_name)+'</b><p>'+esc(c.body)+'</p><small>'+new Date(c.created_at).toLocaleString()+'</small></div>').join(''):'<div class="empty">No shared messages yet.</div>';el.scrollTop=el.scrollHeight}
async function sendChat(){if(!officeClient||!officeProfile)return;const input=document.getElementById('chatInput'),body=input?.value.trim();if(!body)return;const {error}=await officeClient.from('office_messages').insert({sender_id:officeUser.id,sender_name:officeUser?.email?.toLowerCase()==='mehedialimayon@gmail.com'?'Nusrat Nasrin':officeProfile.display_name,body});if(error)return alert('Message not sent: '+error.message);input.value='';await refreshOfficeLive()}
async function publishOfficeNotice(){if(!officeProfile||!['owner','admin','manager'].includes(officeProfile.role))return alert('Manager permission required');const body=prompt('Write shared office notice');if(!body?.trim())return;const {error}=await officeClient.from('office_notices').insert({author_id:officeUser.id,body:body.trim()});if(error)alert(error.message);else await refreshOfficeLive()}
function renderMarketing(m){m.innerHTML='<div class="row"><h1>📣 Marketing Hub</h1><button class="action" onclick="marketingModal()">+ Campaign</button></div><div class="muted">Plan campaigns, record leads and track follow-ups on this device</div><div class="stats" style="margin-top:14px"><div class="card"><div class="muted">Campaigns</div><div class="statvalue">'+campaigns.length+'</div></div><div class="card"><div class="muted">Leads</div><div class="statvalue">'+campaigns.reduce((a,c)=>a+(Number(c.leads)||0),0)+'</div></div></div>'+ (campaigns.length?campaigns.map((c,i)=>'<div class="record"><strong>'+esc(c.title)+'</strong><div class="record-line"><span>Channel</span><b>'+esc(c.channel)+'</b></div><div class="record-line"><span>Leads</span><b>'+esc(c.leads)+'</b></div><div class="record-line"><span>Status</span><b>'+esc(c.status)+'</b></div><div class="record-line"><span>Next Follow-up</span><b>'+esc(c.followup)+'</b></div><button class="ghost" onclick="marketingModal('+i+')">Edit</button></div>').join(''):'<div class="empty">No campaigns yet. Create a marketing campaign.</div>')}
function marketingModal(i=-1){const c=campaigns[i]||{};modal('Marketing Campaign','<div class="formgrid">'+[['Campaign Name','title'],['Channel / Platform','channel'],['Lead Count','leads'],['Status','status'],['Next Follow-up','followup']].map(([label,k])=>'<label>'+label+'<input class="input" id="campaign_'+k+'" value="'+esc(c[k]||'')+'"></label>').join('')+'<button class="action" onclick="saveCampaign('+i+')">Save Campaign</button></div>')}
function saveCampaign(i){const c={};for(const k of ['title','channel','leads','status','followup'])c[k]=document.getElementById('campaign_'+k).value.trim();if(!c.title)return alert('Enter campaign name');if(i>=0)campaigns[i]=c;else campaigns.push(c);saveLocal(marketingKey,campaigns);closeModal();renderMarketing(document.getElementById('main'))}
renderTicker();render();initOfficeLive();
</script></body></html>
